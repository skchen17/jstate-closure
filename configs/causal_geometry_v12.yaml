    output_direction_minimum: 0.8
    task_decision_sign_minimum: 0.8
  horizons: [1, 2, 4, 8, 16]
  authorization_horizons: [1, 2, 4, 8]
  confirmatory_method_limit: 4
  decoder:
    reconstruction_chunk: 65536
    shard_size: 5
  replacement:
    dimension: 512
    horizon_if_h1_fails: 1
  bootstrap_resamples: 10000
  confirmation_seeds: [20260828, 20260829, 20260830]
