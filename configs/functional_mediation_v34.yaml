precision: bfloat16
attention_implementation: eager
context_limit: 512
seed: 340134
source_exclusions: [28, 29, 30, 31, 32, 33]
families: [boolean_logic, modular_arithmetic, short_graph_traversal, simple_state_transition, variable_binding]
roles_per_family: {calibration: 4, development: 16, validation: 8, independent_final: 8}
panel_source: results/v18/processed/crossed_state_{source}_{family}_v18.parquet
prompt_semantic_pairing: same base_trial_id and prompt in Q and F
token_selection:
  rank_max: 8192
  choice: deterministic hash of seed/model/state/token among frozen predecessor candidate library and prefix-rank eligibility
  future_probes: first six usable top-ranked prefix tokens
  current_token_write_or_future_response_used_for_selection: false
factorial: [Y00, Y10, Y01, Y11, Ydonor]
primary_KV: recipient-native
endpoint:
  formal_shared_categories: [selected_logits, semantic_logprob, broad_vocabulary, late_hidden, workspace]
  selected_logits: 64
  broad_logits: 64
  late_hidden: 64
  workspace_layers_per_model: 4
  workspace_dimensions_per_layer: 32
  indices: deterministic seeded without-replacement, model-local and outcome-blind
  scale: model-local calibration-clean empirical RMS variation, frozen before intervention outcomes
  J_secondary_only: true
  future_probes: 6
high_level_gate:
  positive_fraction_min: 0.80
  median_reduction_min: 0.20
  median_alignment_min: 0.50
  families_required: 4
  family_positive_fraction_min: 0.80
  family_median_reduction_min: 0.20
  family_median_alignment_min: 0.50
  bootstrap_lower_reduction_gt: 0.0
  bootstrap_lower_alignment_min: 0.25
bootstrap: {iterations: 2000, seed: 340134, lower_tail: 0.025, unit: state}
functional_stages:
  order: [TRUE_UPDATE, TRANSFORMED_CONTROL, POSTCONV_INPUT, RECURRENT_READ, RESIDUAL_INTEGRATION]
  layer_scope: all recurrent layers simultaneously, no layer search before stage qualification
  source_branch: joint versus Conv-only with same recipient KV and same future probe
  direction: joint-to-Conv-only removal and Conv-only-to-joint reverse insertion
  missing_exact_interface: STAGE_NOT_WRITABLE, no proxy replacement
  residual_integration_rule: patch only recurrent contribution at earliest residual add; if algebraically identical to RECURRENT_READ, report non-separability
stage_gate:
  median_removed_min: 0.50
  median_restored_min: 0.50
  median_reverse_correction_cosine_min: 0.80
  families_required: 4
  family_median_removed_min: 0.50
  family_median_restored_min: 0.50
  family_median_reverse_cosine_min: 0.80
  development_and_validation_required: true
  exact_writeback_required: true
pipeline_sets:
  WRITE_PIPELINE: [POSTCONV_INPUT, TRANSFORMED_CONTROL, TRUE_UPDATE]
  RECURRENT_PIPELINE: [TRUE_UPDATE, RECURRENT_READ]
  FULL_RECURRENCE_TO_RESIDUAL: [POSTCONV_INPUT, TRANSFORMED_CONTROL, TRUE_UPDATE, RECURRENT_READ, RESIDUAL_INTEGRATION]
final_rule: open both 40-state V34 independent finals only after same frozen functional stage or pipeline passes development and validation in both models
later_horizon_rule: h2/h4 only if shared h1 mediator passes
application_rule: authorize only if V34-A or V34-G passes
third_model_rule: authorize only if V34-A or V34-G or V34-H passes
historical_model1_final_reopen: false
