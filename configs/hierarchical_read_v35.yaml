high_level_gate:
  positive_fraction_min: 0.80
  median_reduction_min: 0.20
  median_alignment_min: 0.50
  families_required: 4
  family_positive_fraction_min: 0.80
  family_median_reduction_min: 0.20
  family_median_alignment_min: 0.50
  bootstrap_lower_reduction_gt: 0.0
  bootstrap_lower_alignment_min: 0.25
bootstrap: {iterations: 2000, seed: 350135, lower_tail: 0.025, unit: state}
full_read_gate: {median_removed_min: 0.90, median_restored_min: 0.90, median_cosine_min: 0.90, families_required: 4}
quartile_gate: {median_removed_min: 0.50, median_restored_min: 0.50, median_cosine_min: 0.80, families_required: 4}
late_consolidation_gate:
  late_half_removed_min: 0.75
  late_half_restored_min: 0.75
  early_half_removed_max: 0.40
  early_half_restored_max: 0.40
  faster_difference_min: 0.20
  families_required: 4
progressive_gate:
  monotonic_tolerance: 0.10
  each_increment_min: 0.05
  single_quartile_max: 0.75
  families_required: 4
complementary_gate: {pair_excess_over_best_single_min: 0.10, each_single_max: 0.75, families_required: 4}
redundancy_gate: {each_single_min: 0.50, pair_increment_over_best_single_max: 0.10, families_required: 4}
serial_gate: {conditional_late_gain_min: 0.15, removal_corrob_min: 0.10, families_required: 4}
profile_similarity_gate: {spearman_min: 0.70, pearson_min: 0.70, cosine_min: 0.90, both_models_same_qualitative_gate_required: true}
refinement_rule: only if one quartile or adjacent pair passes development strong gate, then freeze three-layer subwindows before validation; no global 24-layer search
final_rule: open both independent finals only after one prospectively frozen depth organization passes development and validation in both models; FULL_DEPTH_ONLY may be finalist if no smaller organization passes
later_horizon_rule: h2/h4 only after depth organization passes both development and validation
application_rule: targeted applications authorized only for a qualified smaller or structured depth region, no application benchmark in V35
third_model_rule: broad read-side permission inherited from V34; hierarchical mechanism frozen only if V35-F passes
historical_independent_finals_reopen: false
